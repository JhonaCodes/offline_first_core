[package]
name = "offline_first_core"
repository = "https://github.com/JhonaCodes/offline_first_core"
version = "0.6.2"
edition = "2021"
license = "MIT"
description = "Diesel-style embedded database on LMDB 1.0 (natdb): tables, secondary indexes, transactions and a C ABI for Flutter"
readme = "README.MD"
keywords = ["lmdb", "database", "flutter", "offline-first", "diesel"]
categories = ["database", "database-implementations", "api-bindings"]
rust-version = "1.85"
documentation = "https://docs.rs/offline_first_core"
exclude = ["/.github", "/.idea", "/scripts", "/dist"]
authors = ["JhonaCodes"]

[lib]
name = "offline_first_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Measured with `cargo run --release --example bench` (Apple M-series, 10k rows):
# opt-level 3 reads 35-70% faster than 'z' for a 20% larger library.
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding is required to contain panics at the C ABI (`std::panic::catch_unwind`
# in every entry point): with `abort`, any panic kills the host app.
panic = "unwind"

[features]
static = []
# Test only, never enable it in a shipped build: exports
# `ofc_fault_injection_arm`, which makes the next entry point called on the same
# thread panic inside its guard. `tests/panic_boundary.rs` needs it.
fault-injection = []

[[test]]
name = "panic_boundary"
required-features = ["fault-injection"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
log = "0.4.28"
thiserror = "2.0.21"
# LMDB 1.0.2 bindings. natdb-sys provides the cursor operation codes and, on
# Apple targets, locks with pthread mutexes (the App Sandbox rejects semaphores).
natdb = "0.1.1"
natdb-sys = "0.1.1"
